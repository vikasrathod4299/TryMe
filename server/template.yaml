AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: VogueAI Virtual Try-On - Serverless Architecture

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production
  
  # Database
  DatabaseUrl:
    Type: String
    Description: PostgreSQL connection string
    NoEcho: true
  
  # API Keys
  GeminiApiKey:
    Type: String
    Description: Google Gemini API Key
    NoEcho: true
  
  OpenAIApiKey:
    Type: String
    Description: OpenAI API Key
    NoEcho: true
  
  # JWT Security
  SecretKey:
    Type: String
    Description: JWT Secret Key for authentication
    NoEcho: true

  # Razorpay Payments
  RazorpayKeyId:
    Type: String
    Description: Razorpay Key ID
    NoEcho: true
    Default: ""

  RazorpayKeySecret:
    Type: String
    Description: Razorpay Key Secret
    NoEcho: true
    Default: ""

  # Credits
  FreeCreditsOnSignup:
    Type: Number
    Description: Free credits given to new users
    Default: 3

  # CORS Origins (comma-separated)
  CorsOrigins:
    Type: String
    Description: Allowed CORS origins (comma-separated)
    Default: "*"

  # VPC Configuration for RDS connectivity
  VpcId:
    Type: String
    Description: VPC ID where RDS is located
    Default: "vpc-0b41584ed7178313f"

  SubnetIds:
    Type: CommaDelimitedList
    Description: Subnet IDs for Lambda (must be in same VPC as RDS)
    Default: "subnet-0d6f0764f5266315b,subnet-0ee520567da7b309c,subnet-0a13b421f2972e0ba"

  RdsSecurityGroupId:
    Type: String
    Description: Security Group ID of RDS instance
    Default: "sg-0493f820b105b54d2"

Globals:
  Function:
    Timeout: 120
    MemorySize: 1024
    Runtime: python3.12
    Architectures:
      - x86_64
    Environment:
      Variables:
        # Application
        PROJECT_NAME: "VogueAI"
        VERSION: "1.0.0"
        ENVIRONMENT: !Ref Environment
        DEBUG: "False"
        API_V1_STR: "/api/v1"
        LOG_LEVEL: "INFO"
        
        # Database
        DATABASE_URL: !Ref DatabaseUrl
        
        # AWS (AWS_REGION is auto-set by Lambda, don't set it manually)
        S3_BUCKET_NAME: !Ref ImagesBucket
        SQS_QUEUE_URL: !Ref JobsQueue
        
        # API Keys
        GEMINI_API_KEY: !Ref GeminiApiKey
        OPENAI_API_KEY: !Ref OpenAIApiKey
        
        # JWT Security
        SECRET_KEY: !Ref SecretKey
        ACCESS_TOKEN_EXPIRE_MINUTES: "30"
        REFRESH_TOKEN_EXPIRE_DAYS: "7"
        VERIFICATION_CODE_EXPIRE_MINUTES: "10"
        
        # CORS
        BACKEND_CORS_ORIGINS: !Ref CorsOrigins
        
        # Razorpay
        RAZORPAY_KEY_ID: !Ref RazorpayKeyId
        RAZORPAY_KEY_SECRET: !Ref RazorpayKeySecret
        
        # Credits
        FREE_CREDITS_ON_SIGNUP: !Ref FreeCreditsOnSignup

Resources:
  # ============================================
  # S3 Bucket for Images
  # ============================================
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "vogueai-images-${Environment}-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedOrigins:
              - "*"
            MaxAge: 3600
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteTempFilesAfter7Days
            Prefix: "user_"
            Status: Enabled
            ExpirationInDays: 7

  # ============================================
  # SQS Queue for Processing Jobs
  # ============================================
  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "vogueai-jobs-${Environment}"
      VisibilityTimeout: 180  # 3 minutes (longer than Lambda timeout)
      MessageRetentionPeriod: 86400  # 1 day
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobsDeadLetterQueue.Arn
        maxReceiveCount: 3

  JobsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "vogueai-jobs-dlq-${Environment}"
      MessageRetentionPeriod: 1209600  # 14 days

  # ============================================
  # Lambda Security Group (for VPC access to RDS)
  # ============================================
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "vogueai-lambda-sg-${Environment}"
      GroupDescription: Security group for Lambda functions to access RDS
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub "vogueai-lambda-sg-${Environment}"

  # Add Lambda SG to RDS SG inbound rules
  RdsSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: Allow Lambda functions to connect to RDS

  # ============================================
  # API Lambda Function
  # ============================================
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "vogueai-api-${Environment}"
      Handler: lambda_api_handler.handler
      CodeUri: .
      Description: VogueAI FastAPI Application
      MemorySize: 512
      Timeout: 30
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Ref SubnetIds
      Events:
        ApiGateway:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId: !Ref HttpApi
        RootPath:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
            ApiId: !Ref HttpApi
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ImagesBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobsQueue.QueueName
        - VPCAccessPolicy: {}
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: "*"

  # ============================================
  # Worker Lambda Function
  # ============================================
  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "vogueai-worker-${Environment}"
      Handler: lambda_worker_handler.handler
      CodeUri: .
      Description: VogueAI Job Processor (SQS Consumer)
      MemorySize: 2048  # More memory for image processing
      Timeout: 120  # 2 minutes for processing
      EphemeralStorage:
        Size: 1024  # 1GB /tmp storage for images
      # Note: Worker is NOT in VPC to allow internet access for Gemini API
      # RDS is publicly accessible so Worker can still connect to database
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt JobsQueue.Arn
            BatchSize: 1  # Process one job at a time
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ImagesBucket
        - SQSPollerPolicy:
            QueueName: !GetAtt JobsQueue.QueueName
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: "*"

  # ============================================
  # HTTP API Gateway
  # ============================================
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        MaxAge: 600

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  
  ImagesBucketName:
    Description: S3 bucket for images
    Value: !Ref ImagesBucket
  
  JobsQueueUrl:
    Description: SQS queue URL for jobs
    Value: !Ref JobsQueue
  
  ApiFunctionArn:
    Description: API Lambda function ARN
    Value: !GetAtt ApiFunction.Arn
  
  WorkerFunctionArn:
    Description: Worker Lambda function ARN
    Value: !GetAtt WorkerFunction.Arn
