services:
  db:
    image: postgres:16-alpine
    container_name: try_me
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fastapi_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - try_me_network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  try_me_network:
    driver: bridge